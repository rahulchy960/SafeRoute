name: android-ci

# Android quality gate (P007a, ADR 0008): lint, JVM unit tests (Robolectric) and a debug build.
# The same command Rahul runs locally in android/:
#   ./gradlew lint testDebugUnitTest assembleDebug
#
# Since P008b (ADR 0009) it also:
# - runs when contracts/ changes: the build regenerates the API client from
#   contracts/openapi.json, so a contract change that breaks the app fails here;
# - builds the release variant with a dummy base URL (https://example.invalid/, unsigned), and
#   proves that a release build without saferoute.apiBaseUrl fails;
# - checks that the release APK contains none of the debug-only developer tools.
#
# Since P009b (ADR 0012) the app uses Firebase sign-in, and the build needs
# android/app/google-services.json. The real file is never in the repository, so this workflow
# writes a DUMMY one first (project `demo-saferoute`, fake values). Tests never call Firebase.
# A release build refuses the dummy file unless -Psaferoute.allowDummyFirebase=true is passed;
# the steps below build one release that way and prove that the refusal works.
#
# Since P010a (ADR 0015) the app shows a map and needs a map key. The real key is never in the
# repository or in this workflow. The debug build runs without one (the app then says "Map not
# configured"); tests use a fake map and never contact the tile provider. A release build
# refuses to assemble without a real key unless -Psaferoute.allowDummyMapKey=true is passed
# with an obviously fake key; the steps below build one release that way, prove that the
# refusal works, and check that the native libraries in the APKs support 16 KB memory pages.
#
# Since P014b1 (ADR 0027) a build carries the SEND_SMS permission only when it is made with
# the Gradle property saferoute.sendSmsEnabled (by default: debug yes, release no). Google Play
# restricts that permission, so the steps below check that the release APK does not ask for it,
# with the debug APK as the control.
#
# No secrets, no signing, no cloud login: it behaves the same for pull requests from forks. The
# APK is thrown away with the runner.
# Not a required check in the ruleset yet: a path-filtered check would block unrelated PRs.

on:
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two JDKs, both Temurin. 17 compiles and tests the app (jvmToolchain in
      # app/build.gradle.kts). 25 only runs Gradle itself, as android/gradle/
      # gradle-daemon-jvm.properties asks. The last one listed becomes JAVA_HOME.
      - name: Set up JDK 17 (app) and JDK 25 (Gradle daemon)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            25

      # Validates the committed Gradle wrapper jar and caches dependencies. Only runs on main
      # write the cache; pull requests read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Must run before any Gradle task: the Google Services plugin fails without the file.
      - name: Write the dummy google-services.json
        run: |
          sh scripts/write-dummy-google-services
          git check-ignore -q app/google-services.json || {
            echo "::error::android/app/google-services.json must be ignored by git."
            exit 1
          }

      # fromEnv points Gradle at the JDK 17 installed above instead of downloading another one.
      - name: Lint, unit tests and debug build
        run: >-
          ./gradlew lint testDebugUnitTest assembleDebug
          --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      # The placeholder address resolves nowhere; nothing is signed or uploaded. This is the
      # only build allowed to use the dummy Firebase configuration and a dummy map key in a
      # release.
      - name: Release build with a dummy base URL, Firebase configuration and map key
        run: >-
          ./gradlew assembleRelease
          --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          -Psaferoute.apiBaseUrl=https://example.invalid/
          -Psaferoute.allowDummyFirebase=true
          -Psaferoute.mapTilerKey=dummy-map-key-for-ci
          -Psaferoute.allowDummyMapKey=true
          -Psaferoute.sendSmsEnabled=false

      # Two cases: no key at all (the placeholder is used), and the dummy key without the flag.
      - name: A release build without a real map key fails without the allow flag
        run: |
          for key_args in "" "-Psaferoute.mapTilerKey=dummy-map-key-for-ci"; do
            # shellcheck disable=SC2086 # key_args is empty or one argument, on purpose
            if ./gradlew :app:checkReleaseMapKey --console=plain $key_args               -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 > "$RUNNER_TEMP/guard.log" 2>&1; then
              echo "::error::A release build must refuse a missing or dummy map key (checkReleaseMapKey)."
              exit 1
            fi
            # It must fail for this reason and no other.
            grep -q "Release builds need a real map key" "$RUNNER_TEMP/guard.log" || {
              cat "$RUNNER_TEMP/guard.log"
              exit 1
            }
          done
          echo "As expected: a release build refuses a missing or dummy map key."

      - name: A release build without the base URL fails
        run: |
          if ./gradlew :app:checkReleaseApiBaseUrl --console=plain             -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64; then
            echo "::error::A release build without saferoute.apiBaseUrl must fail (checkReleaseApiBaseUrl)."
            exit 1
          fi
          echo "As expected: a release build without saferoute.apiBaseUrl fails."

      - name: A release build with the dummy Firebase configuration fails without the allow flag
        run: |
          if ./gradlew :app:checkReleaseFirebaseConfig --console=plain \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 > "$RUNNER_TEMP/guard.log" 2>&1; then
            echo "::error::A release build must refuse a demo- Firebase project (checkReleaseFirebaseConfig)."
            exit 1
          fi
          # It must fail for this reason and no other.
          grep -q "must not use the dummy Firebase configuration" "$RUNNER_TEMP/guard.log" || {
            cat "$RUNNER_TEMP/guard.log"
            exit 1
          }
          echo "As expected: a release build refuses the dummy Firebase configuration."

      # Last Gradle step on purpose: it takes the file away. `if: always()` on the restore is
      # not needed because nothing after this step uses Gradle.
      - name: A release build without google-services.json fails
        run: |
          mv app/google-services.json "$RUNNER_TEMP/google-services.json"
          if ./gradlew :app:checkReleaseFirebaseConfig --console=plain \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 > "$RUNNER_TEMP/guard.log" 2>&1; then
            echo "::error::A release build without google-services.json must fail."
            exit 1
          fi
          mv "$RUNNER_TEMP/google-services.json" app/google-services.json
          grep -q "Release builds need app/google-services.json" "$RUNNER_TEMP/guard.log" || {
            cat "$RUNNER_TEMP/guard.log"
            exit 1
          }
          echo "As expected: a release build without google-services.json fails."

      # The developer server check lives in src/debug. Class names stay readable because R8 is
      # off (ADR 0008). The debug APK is the control: if it shows no hits, the check is broken.
      - name: The release APK has no debug-only developer tools
        run: |
          hits() { unzip -p "$1" "$2" | grep -a -c "$3" || true; }
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          classes='Lcom/saferoute/app/feature/developer/'
          debug_classes=$(hits "$debug_apk" 'classes*.dex' "$classes")
          release_classes=$(hits "$release_apk" 'classes*.dex' "$classes")
          debug_strings=$(hits "$debug_apk" resources.arsc developer_check)
          release_strings=$(hits "$release_apk" resources.arsc developer_check)
          echo "developer classes: debug $debug_classes, release $release_classes"
          echo "developer strings: debug $debug_strings, release $release_strings"
          if [ "$debug_classes" -eq 0 ] || [ "$debug_strings" -eq 0 ]; then
            echo "::error::No developer tools found in the debug APK: this check is not looking in the right place."
            exit 1
          fi
          if [ "$release_classes" -ne 0 ] || [ "$release_strings" -ne 0 ]; then
            echo "::error::The release APK contains the debug-only developer tools."
            exit 1
          fi

      # SEND_SMS may be in a debug build (to try SMS alerts on a phone) and must not be in the
      # release APK built above. aapt2 prints the permissions an APK asks for. The debug APK is
      # the control: if it shows no SEND_SMS, the check is not looking in the right place.
      - name: The release APK does not ask for SEND_SMS
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          asks() { "$build_tools/aapt2" dump permissions "$1" | grep -c "android.permission.$2" || true; }
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          debug_send=$(asks "$debug_apk" SEND_SMS)
          release_send=$(asks "$release_apk" SEND_SMS)
          release_read=$(asks "$release_apk" READ_SMS)
          echo "SEND_SMS: debug $debug_send, release $release_send; READ_SMS in release: $release_read"
          if [ "$debug_send" -eq 0 ]; then
            echo "::error::SEND_SMS not found in the debug APK: this check is not looking in the right place."
            exit 1
          fi
          if [ "$release_send" -ne 0 ] || [ "$release_read" -ne 0 ]; then
            echo "::error::The release APK asks for an SMS permission."
            exit 1
          fi

      # Google Play requires apps that target Android 15+ to work on devices whose memory pages
      # are 16 KB instead of 4 KB (64-bit devices only). Two things must hold for every native
      # library (.so): its position inside the APK is a multiple of 16 KB (zipalign checks
      # that), and its loadable segments are aligned to 16 KB (readelf shows that). The map
      # library is the largest one. 32-bit libraries are outside the requirement.
      - name: Native libraries support 16 KB memory pages
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/zipalign" -c -P 16 4 "$debug_apk"
          "$build_tools/zipalign" -c -P 16 4 "$release_apk"

          work="$RUNNER_TEMP/native-libs"
          mkdir -p "$work"
          unzip -q -o "$release_apk" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d "$work"
          checked=0
          failed=0
          while IFS= read -r library; do
            checked=$((checked + 1))
            for alignment in $(readelf -lW "$library" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((alignment)) -lt 16384 ]; then
                echo "::error::Not aligned for 16 KB pages: ${library#"$work"/} ($alignment)"
                failed=1
              fi
            done
          done < <(find "$work" -name '*.so' | sort)
          echo "64-bit native libraries checked: $checked"
          # The map library must be among them, or this check is not looking in the right place.
          if [ ! -f "$work/lib/arm64-v8a/libmaplibre.so" ] || [ "$failed" -ne 0 ]; then
            echo "::error::16 KB page-size check failed."
            exit 1
          fi

      - name: Upload the lint report (only when the job failed)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      # The log names a failed test and its line, not the values ("expected X but was Y").
      # The HTML report (open index.html) and the XML files have them. Tests use fake
      # values only (CLAUDE.md, "Android rules"), so the reports hold no personal data.
      - name: Upload the unit-test reports (only when the job failed)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
