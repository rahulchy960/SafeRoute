name: infra-ci

# Checks the staging setup script (P006c, ADR 0007): infra/staging/bootstrap-staging.ps1.
#
#   infra-ci          PSScriptAnalyzer and the Pester tests with PowerShell 7 on Linux.
#   infra-ci-windows  The same on Windows, where the script is actually run: once with
#                     Windows PowerShell 5.1 and once with PowerShell 7 (gcloud is gcloud.cmd there).
#
# The tests replace gcloud and gh with fixtures and refuse to start the real tools, so this
# workflow needs no cloud login and no secrets and behaves the same for pull requests from forks.
# The two PowerShell modules are downloaded at pinned versions and checked against SHA-512 values
# committed in infra/staging/tests/Invoke-InfraCheck.ps1.
# deploy-staging.yml is in the path filter because a test reads the secret and variable names
# from it; osrm-staging.yml because a test compares its resource names with the script's defaults.
# Not a required check in the ruleset: path-filtered checks would block unrelated PRs.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/osrm-staging.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/osrm-staging.yml"

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-ci:
    name: infra-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (the stdin test starts a node child process)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: backend/.nvmrc

      - name: PSScriptAnalyzer and Pester (PowerShell 7)
        shell: pwsh
        run: ./infra/staging/tests/Invoke-InfraCheck.ps1

  infra-ci-windows:
    name: infra-ci-windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (the stdin test starts a node child process)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: backend/.nvmrc

      - name: PSScriptAnalyzer and Pester (Windows PowerShell 5.1)
        shell: powershell
        run: .\infra\staging\tests\Invoke-InfraCheck.ps1

      - name: PSScriptAnalyzer and Pester (PowerShell 7)
        shell: pwsh
        run: .\infra\staging\tests\Invoke-InfraCheck.ps1
