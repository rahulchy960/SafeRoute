<svg xmlns="http://www.w3.org/2000/svg" width="1354" height="1603" viewBox="0 0 1354 1603" font-family="Helvetica, Arial, sans-serif">
<title>Route request flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Route request flow</text>
<text x="40" y="86" font-size="14" fill="#495057">Positions travel in request bodies on our API and are never logged or stored. One attempt per request: a sleeping routing service answers 503 with Retry-After and the app tries again (P012b, ADR 0020)</text>
<rect x="40" y="114" width="276" height="1403" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Phone</text>
<rect x="352" y="114" width="276" height="1403" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="366" y="135" font-size="14" font-weight="700" fill="#495057">SafeRoute API (Cloud Run, sa-api-runtime)</text>
<rect x="664" y="114" width="276" height="1403" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="678" y="135" font-size="14" font-weight="700" fill="#495057">Google Cloud, private</text>
<line x1="178" y1="270" x2="490" y2="316" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="403" x2="490" y2="449" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="515" x2="490" y2="561" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610" y1="604.5" x2="682" y2="604.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="648" x2="490" y2="694" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="822" x2="490" y2="868" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610" y1="922" x2="682" y2="922" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="976" x2="490" y2="1022" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610" y1="1076" x2="682" y2="1076" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="802" y1="1130" x2="802" y2="1207" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="1130" x2="490" y2="1176" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="1325" x2="490" y2="1381" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="1325" x2="178" y2="1371" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="240" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="178" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="178" y="190.4">App: POST /v1/routes with</tspan>
<tspan x="178" y="211.2">origin, destination and mode</tspan>
<tspan x="178" y="232">in the body, and a Firebase</tspan>
<tspan x="178" y="252.8">ID token</tspan>
</text>
<rect x="58" y="1371" width="240" height="128" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="178" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="178" y="1399">App shows 1 to 3 routes with</tspan>
<tspan x="178" y="1419.8">the map credit, or a calm</tspan>
<tspan x="178" y="1440.6">message; on 503 it waits</tspan>
<tspan x="178" y="1461.4">Retry-After and asks again</tspan>
<tspan x="178" y="1482.2">(P012c)</tspan>
</text>
<rect x="370" y="316" width="240" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="344.3">Validation: ranges, mode,</tspan>
<tspan x="490" y="365.1">points at least 20 m apart</tspan>
<tspan x="490" y="385.9">(400)</tspan>
</text>
<rect x="370" y="449" width="240" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="477.2">requireUser: Firebase token,</tspan>
<tspan x="490" y="498">account, consent (401, 403)</tspan>
</text>
<rect x="370" y="561" width="240" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="589.3">Rate limiter: burst 10, 300</tspan>
<tspan x="490" y="610.1">per day, global budget (429,</tspan>
<tspan x="490" y="630.9">503)</tspan>
</text>
<rect x="370" y="694" width="240" height="128" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="722">Extent check: both points</tspan>
<tspan x="490" y="742.8">inside the covered area,</tspan>
<tspan x="490" y="763.6">straight-line limit per mode</tspan>
<tspan x="490" y="784.4">(422 outside_covered_area,</tspan>
<tspan x="490" y="805.2">route_too_long)</tspan>
</text>
<rect x="370" y="868" width="240" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="896.4">ID token of the API's own</tspan>
<tspan x="490" y="917.2">account, audience = the</tspan>
<tspan x="490" y="938">service URL, cached until 5</tspan>
<tspan x="490" y="958.8">min before expiry</tspan>
</text>
<rect x="370" y="1022" width="240" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="1050.4">OSRM adapter: one GET,</tspan>
<tspan x="490" y="1071.2">timeout 25 s (not measured</tspan>
<tspan x="490" y="1092">yet), no retry, answer</tspan>
<tspan x="490" y="1112.8">size-limited and parsed</tspan>
</text>
<rect x="370" y="1176" width="240" height="149" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="1204.1">Mapped answer: 200 routes</tspan>
<tspan x="490" y="1224.9">with bbox, 404</tspan>
<tspan x="490" y="1245.7">no_route_found, 422</tspan>
<tspan x="490" y="1266.5">location_not_routable, 503</tspan>
<tspan x="490" y="1287.3">routing_unavailable +</tspan>
<tspan x="490" y="1308.1">Retry-After 10</tspan>
</text>
<rect x="370" y="1381" width="240" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="1409.4">One log line: outcome,</tspan>
<tspan x="490" y="1430.2">latency, route count, mode.</tspan>
<tspan x="490" y="1451">Never a position, a geometry</tspan>
<tspan x="490" y="1471.8">or a URL</tspan>
</text>
<rect x="682" y="561" width="240" height="87" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="802" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="802" y="589.3">PostgreSQL:</tspan>
<tspan x="802" y="610.1">rate_limit_buckets (keys</tspan>
<tspan x="802" y="630.9">hold no position)</tspan>
</text>
<rect x="682" y="889" width="240" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="802" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="802" y="917.2">Metadata server (no key, no</tspan>
<tspan x="802" y="938">library)</tspan>
</text>
<rect x="682" y="1022" width="240" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="802" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="802" y="1050.4">OSRM service for the mode:</tspan>
<tspan x="802" y="1071.2">private, IAM invoker = the</tspan>
<tspan x="802" y="1092">API only, may be asleep</tspan>
<tspan x="802" y="1112.8">(scale to zero)</tspan>
</text>
<rect x="682" y="1207" width="240" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="802" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="802" y="1235.3">Its request log is excluded:</tspan>
<tspan x="802" y="1256.1">OSRM takes coordinates in</tspan>
<tspan x="802" y="1276.9">the URL path</tspan>
</text>
<rect x="604.4" y="593.5" width="83.2" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="646" y="609" font-size="13" fill="#1e1e1e" text-anchor="middle">take a token</text>
<rect x="590.2" y="911" width="111.6" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="646" y="926.5" font-size="13" fill="#1e1e1e" text-anchor="middle">when not cached</text>
<rect x="594.4" y="1065" width="103.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="646" y="1080.5" font-size="13" fill="#1e1e1e" text-anchor="middle">Bearer ID token</text>
<rect x="303.8" y="1337" width="60.4" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="334" y="1352.5" font-size="13" fill="#1e1e1e" text-anchor="middle">no-store</text>
<rect x="40" y="1538" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1551" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1538" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1551" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1538" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="250.3" y="1551" font-size="13" fill="#495057">Data</text>
<rect x="303.1" y="1538" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="325.1" y="1551" font-size="13" fill="#495057">Security / emergency</text>
<rect x="476.7" y="1538" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="498.7" y="1551" font-size="13" fill="#495057">External</text>
</svg>
