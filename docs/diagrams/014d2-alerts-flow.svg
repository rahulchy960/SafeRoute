<rect x="118" y="162" width="240" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="238" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="238" y="190.4">saferoute-api: an error is</tspan>
<tspan x="238" y="211.2">logged as class, code and</tspan>
<tspan x="238" y="232">stack frames. Never its</tspan>
<tspan x="238" y="252.8">message</tspan>
</text>
