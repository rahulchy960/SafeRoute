<text x="238" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="238" y="324.3">Cloud Run metrics: 5xx</tspan>
<tspan x="238" y="345.1">count, p95 latency (API and</tspan>
<tspan x="238" y="365.9">routing services)</tspan>
</text>
<rect x="118" y="409" width="240" height="66" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="238" font-size="16" fill="#1e1e1e" text-anchor="middle">
