<tspan x="838" y="902">search_provider_errors</tspan>
</text>
<rect x="1018" y="761" width="240" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1138" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1138" y="789.2">Seven alert policies</tspan>
<tspan x="1138" y="810">(infra/staging/alerts)</tspan>
</text>
<rect x="1018" y="853" width="240" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1138" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1138" y="881.2">Billing budget: 50, 90, 100%</tspan>
<tspan x="1138" y="902">before credits</tspan>
</text>
<rect x="1318" y="1021" width="240" height="56" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1438" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1438" y="1054.6">E-mail to the developer</tspan>
</text>
<rect x="1318" y="1103" width="240" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1438" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1438" y="1131.4">The 10-minute weekly</tspan>
<tspan x="1438" y="1152.2">check: Error Reporting,</tspan>
<tspan x="1438" y="1173">incidents, metrics, billing,</tspan>
<tspan x="1438" y="1193.8">Crashlytics</tspan>
</text>
<rect x="1318" y="1237" width="240" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1438" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1438" y="1265.3">request_id leads to every log</tspan>
<tspan x="1438" y="1286.1">line of one request, not to its</tspan>
<tspan x="1438" y="1306.9">content</tspan>
</text>
