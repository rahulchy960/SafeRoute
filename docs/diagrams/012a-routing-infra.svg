<rect x="196" y="162" width="250" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="321" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="321" y="190.3">Geofabrik extract of</tspan>
<tspan x="321" y="211.1">OpenStreetMap (ODbL 1.0),</tspan>
<tspan x="321" y="231.9">dated, MD5 checked</tspan>
</text>
<rect x="196" y="299" width="250" height="87" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="321" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="321" y="327.3">build-image.mjs: allowlisted</tspan>
<tspan x="321" y="348.1">URL, metadata.json, image</tspan>
<tspan x="321" y="368.9">labels</tspan>
</text>
<rect x="196" y="436" width="250" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="321" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="321" y="464.3">Stage 1: osmium cuts the</tspan>
<tspan x="321" y="485.1">extent (state boundary</tspan>
<tspan x="321" y="505.9">relation, a box, or the sample)</tspan>
</text>
<rect x="58" y="573" width="250" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="601.4">Stage 2: osrm-extract,</tspan>
<tspan x="183" y="622.2">osrm-partition,</tspan>
<tspan x="183" y="643">osrm-customize (MLD) for</tspan>
<tspan x="183" y="663.8">foot or car</tspan>
</text>
<rect x="58" y="731" width="250" height="108" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="759.4">Image saferoute-osrm: one</tspan>
<tspan x="183" y="780.2">profile, graph baked in,</tspan>
<tspan x="183" y="801">osrm-routed as non-root, log</tspan>
<tspan x="183" y="821.8">level WARNING</tspan>
</text>
<rect x="334" y="583.5" width="250" height="87" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="459" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="459" y="611.8">state-extent.json: simplified</tspan>
<tspan x="459" y="632.6">outline for the API's</tspan>
<tspan x="459" y="653.4">inside/outside answer</tspan>
</text>
<rect x="656" y="583.5" width="250" height="87" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="781" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="781" y="611.8">osrm-ci: the whole pipeline on</tspan>
<tspan x="781" y="632.6">a 79 KB sample fixture, both</tspan>
<tspan x="781" y="653.4">profiles</tspan>
</text>
<rect x="656" y="731" width="250" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="781" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="781" y="759.4">local-smoke.mjs: routes</tspan>
<tspan x="781" y="780.2">between public places, limits,</tspan>
<tspan x="781" y="801">user, labels, NO request path</tspan>
<tspan x="781" y="821.8">in the log</tspan>
</text>
<rect x="656" y="889" width="250" height="87" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="781" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="781" y="917.3">measure.mjs: p50/p95,</tspan>
<tspan x="781" y="938.1">NoRoute rate, memory</tspan>
<tspan x="781" y="958.9">(seeded random points)</tspan>
</text>
<rect x="1116" y="899.5" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="1241" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1241" y="927.7">Artifact Registry:</tspan>
<tspan x="1241" y="948.5">osrm-&lt;profile&gt;-&lt;extract date&gt;</tspan>
</text>
<rect x="978" y="1026" width="250" height="128" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1103" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1103" y="1054">Cloud Run</tspan>
<tspan x="1103" y="1074.8">saferoute-osrm-walking:</tspan>
<tspan x="1103" y="1095.6">private, role-less</tspan>
<tspan x="1103" y="1116.4">sa-osrm-runtime, scales to</tspan>
<tspan x="1103" y="1137.2">zero</tspan>
</text>
<rect x="1254" y="1026" width="250" height="128" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1379" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1379" y="1054">Cloud Run</tspan>
<tspan x="1379" y="1074.8">saferoute-osrm-driving:</tspan>
<tspan x="1379" y="1095.6">private, role-less</tspan>
<tspan x="1379" y="1116.4">sa-osrm-runtime, scales to</tspan>
<tspan x="1379" y="1137.2">zero</tspan>
</text>
<rect x="978" y="1204" width="250" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1103" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1103" y="1232.3">Platform request logs of both</tspan>
<tspan x="1103" y="1253.1">services excluded: their URLs</tspan>
<tspan x="1103" y="1273.9">hold coordinates</tspan>
</text>
<rect x="1254" y="1204" width="250" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1379" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1379" y="1232.3">saferoute-api (sa-api-runtime):</tspan>
<tspan x="1379" y="1253.1">run.invoker + Google ID token,</tspan>
<tspan x="1379" y="1273.9">POST /v1/routes (P012b)</tspan>
</text>
<rect x="1116" y="1341" width="250" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1241" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1241" y="1369.2">Android app: directions</tspan>
<tspan x="1241" y="1390">(P012c). It never calls OSRM</tspan>
</text>
