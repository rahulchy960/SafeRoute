<svg xmlns="http://www.w3.org/2000/svg" width="1562" height="1511" viewBox="0 0 1562 1511" font-family="Helvetica, Arial, sans-serif">
<title>Routing infrastructure: from OpenStreetMap to private OSRM services</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Routing infrastructure: from OpenStreetMap to private OSRM services</text>
<text x="40" y="86" font-size="14" fill="#495057">Built and measured in P012a (left and middle); the staging services and their callers come in the next pull requests (right) (ADR 0020)</text>
<rect x="40" y="114" width="562" height="1311" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Data and image build (P012a)</text>
<rect x="638" y="114" width="286" height="1311" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="652" y="135" font-size="14" font-weight="700" fill="#495057">Checks (P012a)</text>
<rect x="960" y="114" width="562" height="1311" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="974" y="135" font-size="14" font-weight="700" fill="#495057">Google Cloud staging (planned: P012a part 2, P012b, P012c)</text>
