<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="1875" viewBox="0 0 1146 1875" font-family="Helvetica, Arial, sans-serif">
<title>Onboarding and session</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Onboarding and session</text>
<text x="40" y="86" font-size="14" fill="#495057">Order: age, consent, phone. The session state decides the screen; after the first sign-in the app opens offline (P009b and P009c, ADR 0010, ADR 0012)</text>
<rect x="40" y="114" width="251" height="1675" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Onboarding screens</text>
<rect x="327" y="114" width="492" height="1675" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="341" y="135" font-size="14" font-weight="700" fill="#495057">SessionRepository: app start with a sign-in</text>
<rect x="855" y="114" width="251" height="1675" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="869" y="135" font-size="14" font-weight="700" fill="#495057">Outcomes</text>
<line x1="165.5" y1="249" x2="165.5" y2="309" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="165.5" y1="375" x2="980.5" y2="435" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="165.5" y1="375" x2="165.5" y2="435" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="165.5" y1="522" x2="165.5" y2="582" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="165.5" y1="648" x2="165.5" y2="708" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="165.5" y1="774" x2="573" y2="834" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="573" y1="890" x2="573" y2="950" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="573" y1="1037" x2="573" y2="1112.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="573" y1="1168.5" x2="452.5" y2="1264.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="573" y1="1168.5" x2="693.5" y2="1264.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.5" y1="1140.5" x2="873" y2="1140.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="452.5" y1="1351.5" x2="452.5" y2="1432" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="573" y1="1168.5" x2="980.5" y2="1244" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="452.5" y1="1351.5" x2="980.5" y2="1558" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="693.5" y1="1351.5" x2="980.5" y2="1558" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="452.5" y1="1498" x2="980.5" y2="1558" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="980.5" y1="1624" x2="980.5" y2="1684" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="215" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="165.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="165.5" y="190.3">Welcome: not an</tspan>
<tspan x="165.5" y="211.1">emergency service, call</tspan>
<tspan x="165.5" y="231.9">112</tspan>
</text>
<rect x="58" y="309" width="215" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="165.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="165.5" y="337.2">NeedsAge: I am 18 or</tspan>
<tspan x="165.5" y="358">older?</tspan>
</text>
<rect x="58" y="435" width="215" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="165.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="165.5" y="463.3">NeedsConsent: notice for</tspan>
<tspan x="165.5" y="484.1">account_core (EN / BN), I</tspan>
<tspan x="165.5" y="504.9">agree</tspan>
</text>
<rect x="58" y="582" width="215" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="165.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="165.5" y="610.2">SignedOut: phone entry</tspan>
<tspan x="165.5" y="631">(+91)</tspan>
</text>
<rect x="58" y="708" width="215" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="165.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="165.5" y="736.2">SMS code (Firebase,</tspan>
<tspan x="165.5" y="757">PhoneAuthGateway)</tspan>
</text>
<rect x="465.5" y="834" width="215" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="573" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="573" y="867.6">Signed in with Firebase</tspan>
</text>
<rect x="465.5" y="950" width="215" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="573" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="573" y="978.3">Ready once before?</tspan>
<tspan x="573" y="999.1">Show Home at once,</tspan>
<tspan x="573" y="1019.9">check in the background</tspan>
</text>
<rect x="465.5" y="1112.5" width="215" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="573" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="573" y="1146.1">GET /v1/me</tspan>
</text>
<rect x="345" y="1264.5" width="215" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="452.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="452.5" y="1292.8">GET /v1/me/consents:</tspan>
<tspan x="452.5" y="1313.6">account_core granted for</tspan>
<tspan x="452.5" y="1334.4">the current notice?</tspan>
</text>
<rect x="586" y="1264.5" width="215" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="693.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="693.5" y="1292.8">NeedsBootstrap: POST</tspan>
<tspan x="693.5" y="1313.6">/v1/me/bootstrap with</tspan>
<tspan x="693.5" y="1334.4">age and consent</tspan>
</text>
<rect x="345" y="1432" width="215" height="66" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="452.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="452.5" y="1460.2">PUT consent for</tspan>
<tspan x="452.5" y="1481">account_core</tspan>
</text>
<rect x="873" y="435" width="215" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="980.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="980.5" y="463.3">Blocked UNDER_18: after</tspan>
<tspan x="980.5" y="484.1">a confirmation; one local</tspan>
<tspan x="980.5" y="504.9">flag, no network, no undo</tspan>
</text>
<rect x="873" y="1097" width="215" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="980.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="980.5" y="1125.3">Error (retryable): first run</tspan>
<tspan x="980.5" y="1146.1">without a connection, or</tspan>
<tspan x="980.5" y="1166.9">503</tspan>
</text>
<rect x="873" y="1244" width="215" height="128" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="980.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="980.5" y="1272">401 after one token</tspan>
<tspan x="980.5" y="1292.8">refresh: sign out, phone</tspan>
<tspan x="980.5" y="1313.6">entry again.</tspan>
<tspan x="980.5" y="1334.4">account_deleted:</tspan>
<tspan x="980.5" y="1355.2">Blocked, sign out</tspan>
</text>
<rect x="873" y="1558" width="215" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="980.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="980.5" y="1586.2">Ready: Home (also offline</tspan>
<tspan x="980.5" y="1607">after the first time)</tspan>
</text>
<rect x="873" y="1684" width="215" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="980.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="980.5" y="1712.3">Later: Trusted Circle</tspan>
<tspan x="980.5" y="1733.1">consent (ADR 0011, not</tspan>
<tspan x="980.5" y="1753.9">built)</tspan>
</text>
<rect x="541.5" y="394" width="63" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="573" y="409.5" font-size="13" fill="#1e1e1e" text-anchor="middle">under 18</text>
<rect x="148.7" y="394" width="33.6" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="165.5" y="409.5" font-size="13" fill="#1e1e1e" text-anchor="middle">18+</text>
<rect x="143.1" y="541" width="44.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="165.5" y="556.5" font-size="13" fill="#1e1e1e" text-anchor="middle">agree</text>
<rect x="495.8" y="1205.5" width="33.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="512.8" y="1221" font-size="13" fill="#1e1e1e" text-anchor="middle">200</text>
<rect x="572.3" y="1205.5" width="122" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="633.3" y="1221" font-size="13" fill="#1e1e1e" text-anchor="middle">bootstrap_required</text>
<rect x="735.9" y="1129.5" width="81.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="776.8" y="1145" font-size="13" fill="#1e1e1e" text-anchor="middle">offline / 503</text>
<rect x="365.5" y="1380.8" width="174" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="452.5" y="1396.3" font-size="13" fill="#1e1e1e" text-anchor="middle">old or missing, after I agree</text>
<rect x="706.3" y="1195.3" width="141" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="776.8" y="1210.8" font-size="13" fill="#1e1e1e" text-anchor="middle">401 / account_deleted</text>
<rect x="689.8" y="1443.8" width="53.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="716.5" y="1459.3" font-size="13" fill="#1e1e1e" text-anchor="middle">current</text>
<rect x="40" y="1810" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1823" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1810" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1823" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1810" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="250.3" y="1823" font-size="13" fill="#495057">Security / emergency</text>
<rect x="401.9" y="1810" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="423.9" y="1823" font-size="13" fill="#495057">External</text>
</svg>
