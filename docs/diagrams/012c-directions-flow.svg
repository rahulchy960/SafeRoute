<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="1317" viewBox="0 0 1332 1317" font-family="Helvetica, Arial, sans-serif">
<title>Directions flow (states)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Directions flow (states)</text>
<text x="40" y="86" font-size="14" fill="#495057">From a chosen place to routes on the map. Loading always ends: a sleeping routing service is waited for at most twice, then Try again. Nothing about a route is stored or logged (P012c1, ADR 0020)</text>
<rect x="40" y="114" width="266" height="1117" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Before a request</text>
<rect x="342" y="114" width="266" height="1117" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="356" y="135" font-size="14" font-weight="700" fill="#495057">Asking</text>
<rect x="644" y="114" width="522" height="1117" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="658" y="135" font-size="14" font-weight="700" fill="#495057">What the sheet shows</text>
<line x1="173" y1="270" x2="173" y2="316" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="173" y1="424" x2="173" y2="470" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="173" y1="598" x2="475" y2="644" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="752" x2="475" y2="808" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="916" x2="475" y2="972" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="1059" x2="475" y2="1105" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="752" x2="777" y2="798" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="752" x2="1033" y2="808" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="777" y1="926" x2="777" y2="972" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="777" y1="1059" x2="777" y2="1115.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="230" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="190.4">Closed: the place card with</tspan>
<tspan x="173" y="211.2">Directions. The first time</tspan>
<tspan x="173" y="232">ever, the Intro comes next;</tspan>
<tspan x="173" y="252.8">afterwards it is skipped</tspan>
</text>
<rect x="58" y="316" width="230" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="344.4">Intro (once ever): your start</tspan>
<tspan x="173" y="365.2">and destination are sent to</tspan>
<tspan x="173" y="386">SafeRoute, nothing is</tspan>
<tspan x="173" y="406.8">stored</tspan>
</text>
<rect x="58" y="470" width="230" height="128" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="498">NeedsOrigin: no</tspan>
<tspan x="173" y="518.8">permission, searching or no</tspan>
<tspan x="173" y="539.6">position. Sends nothing;</tspan>
<tspan x="173" y="560.4">'Use my location' is the</tspan>
<tspan x="173" y="581.2">usual permission flow</tspan>
</text>
<rect x="360" y="644" width="230" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="672.4">Loading: one request</tspan>
<tspan x="475" y="693.2">(POST /v1/routes). Another</tspan>
<tspan x="475" y="714">mode or Try again cancels</tspan>
<tspan x="475" y="734.8">it and starts a new one</tspan>
</text>
<rect x="360" y="808" width="230" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="836.4">Loading, 'Starting the</tspan>
<tspan x="475" y="857.2">routing service': shown</tspan>
<tspan x="475" y="878">after 5 s, or on 503 with</tspan>
<tspan x="475" y="898.8">Retry-After</tspan>
</text>
<rect x="360" y="972" width="230" height="87" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="1000.3">Wait Retry-After (at most 15</tspan>
<tspan x="475" y="1021.1">s) and ask again, at most 2</tspan>
<tspan x="475" y="1041.9">times</tspan>
</text>
<rect x="662" y="798" width="230" height="128" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="777" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="777" y="826">Results: 1 to 3 cards</tspan>
<tspan x="777" y="846.8">(duration, distance,</tspan>
<tspan x="777" y="867.6">Fastest), credit line; routes</tspan>
<tspan x="777" y="888.4">on the map, camera fits the</tspan>
<tspan x="777" y="909.2">selected one</tspan>
</text>
<rect x="662" y="972" width="230" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="777" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="777" y="1000.3">Tap a card: another route is</tspan>
<tspan x="777" y="1021.1">selected; no request, the</tspan>
<tspan x="777" y="1041.9">map stays put</tspan>
</text>
<rect x="918" y="808" width="230" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1033" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1033" y="836.4">Answer about the places</tspan>
<tspan x="1033" y="857.2">(no Try again): outside</tspan>
<tspan x="1033" y="878">covered area, no route, not</tspan>
<tspan x="1033" y="898.8">near a road, too far</tspan>
</text>
<rect x="360" y="1105" width="230" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="1133.4">Failed with Try again:</tspan>
<tspan x="475" y="1154.2">offline, rate limited,</tspan>
<tspan x="475" y="1175">unavailable, or still starting</tspan>
<tspan x="475" y="1195.8">after the waits</tspan>
</text>
<rect x="662" y="1115.5" width="230" height="87" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="777" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="777" y="1143.8">Close, back, or another</tspan>
<tspan x="777" y="1164.6">place: routes leave the map</tspan>
<tspan x="777" y="1185.4">and memory</tspan>
</text>
<rect x="141.1" y="436" width="63.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="173" y="451.5" font-size="13" fill="#1e1e1e" text-anchor="middle">Continue</text>
<rect x="269.5" y="610" width="109" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="324" y="625.5" font-size="13" fill="#1e1e1e" text-anchor="middle">a position exists</text>
<rect x="432.1" y="769" width="85.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="475" y="784.5" font-size="13" fill="#1e1e1e" text-anchor="middle">slow, or 503</text>
<rect x="445" y="1071" width="60.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="475" y="1086.5" font-size="13" fill="#1e1e1e" text-anchor="middle">still 503</text>
<rect x="609.1" y="764" width="33.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="626" y="779.5" font-size="13" fill="#1e1e1e" text-anchor="middle">200</text>
<rect x="722.4" y="769" width="63.2" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="754" y="784.5" font-size="13" fill="#1e1e1e" text-anchor="middle">404, 422</text>
<rect x="40" y="1252" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1265" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1252" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1265" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1252" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="250.3" y="1265" font-size="13" fill="#495057">Data</text>
<rect x="303.1" y="1252" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="325.1" y="1265" font-size="13" fill="#495057">Security / emergency</text>
<rect x="476.7" y="1252" width="16" height="16" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="1.5"/>
<text x="498.7" y="1265" font-size="13" fill="#495057">Infra / workflow</text>
</svg>
