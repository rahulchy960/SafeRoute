<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="1800" viewBox="0 0 1332 1800" font-family="Helvetica, Arial, sans-serif">
<title>Emergency contacts: data model and opt-out</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Emergency contacts: data model and opt-out</text>
<text x="40" y="86" font-size="14" fill="#495057">The server sends no message. The opt-out token travels in the URL fragment, which a browser never sends to a server, and then in a request body (P013a, ADR 0024)</text>
<rect x="40" y="114" width="286" height="1600" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">User's phone</text>
<rect x="362" y="114" width="286" height="1600" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="376" y="135" font-size="14" font-weight="700" fill="#495057">SafeRoute API</text>
<rect x="684" y="114" width="286" height="1600" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="698" y="135" font-size="14" font-weight="700" fill="#495057">PostgreSQL</text>
<rect x="1006" y="114" width="286" height="1600" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="1020" y="135" font-size="14" font-weight="700" fill="#495057">Contact's phone (no account)</text>
<line x1="308" y1="205.5" x2="702" y2="205.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="183" y1="249" x2="183" y2="316" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="308" y1="349" x2="380" y2="349" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="505" y1="403" x2="827" y2="449" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="827" y1="238.5" x2="827" y2="449" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="183" y1="382" x2="183" y2="623" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="308" y1="677" x2="380" y2="677" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="505" y1="720.5" x2="827" y2="777" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="827" y1="577" x2="827" y2="777" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="183" y1="731" x2="183" y2="787.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="183" y1="874.5" x2="1149" y2="941.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1024" y1="985" x2="630" y2="985" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1149" y1="1028.5" x2="1149" y2="1085" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1149" y1="1193" x2="1149" y2="1280.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1024" y1="1313.5" x2="630" y2="1313.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="505" y1="1388" x2="827" y2="1434" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="505" y1="1588" x2="827" y2="1542" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="250" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="190.3">App: user agrees to sos_alerts</tspan>
<tspan x="183" y="211.1">(PUT</tspan>
<tspan x="183" y="231.9">/v1/me/consents/sos_alerts)</tspan>
</text>
<rect x="58" y="316" width="250" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="344.2">App: POST /v1/contacts with</tspan>
<tspan x="183" y="365">name and phone in the body</tspan>
</text>
<rect x="58" y="623" width="250" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="651.4">App: POST</tspan>
<tspan x="183" y="672.2">/v1/contacts/{id}/invite, gets</tspan>
<tspan x="183" y="693">the token once, keeps it in</tspan>
<tspan x="183" y="713.8">memory only</tspan>
</text>
<rect x="58" y="787.5" width="250" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="815.8">User sends the invite from</tspan>
<tspan x="183" y="836.6">their own SMS app: link = API</tspan>
<tspan x="183" y="857.4">address + /c#token</tspan>
</text>
<rect x="380" y="295" width="250" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="323.4">Create: lock the user's row,</tspan>
<tspan x="505" y="344.2">sos_alerts granted? own</tspan>
<tspan x="505" y="365">number? duplicate? opted out?</tspan>
<tspan x="505" y="385.8">at most 5</tspan>
</text>
<rect x="380" y="633.5" width="250" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="661.8">Invite: 128 random bits, store</tspan>
<tspan x="505" y="682.6">SHA-256 only, at most 10</tspan>
<tspan x="505" y="703.4">links per contact</tspan>
</text>
<rect x="380" y="931" width="250" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="959.4">GET /c: one static page for</tspan>
<tspan x="505" y="980.2">everyone, strict CSP by hash,</tspan>
<tspan x="505" y="1001">no cookie. The request carries</tspan>
<tspan x="505" y="1021.8">NO token</tspan>
</text>
<rect x="380" y="1239" width="250" height="149" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="1267.1">POST</tspan>
<tspan x="505" y="1287.9">/v1/public/contacts/opt-out</tspan>
<tspan x="505" y="1308.7">with the token in the BODY:</tspan>
<tspan x="505" y="1329.5">shared rate limit, lookup by</tspan>
<tspan x="505" y="1350.3">hash, same 404 for every bad</tspan>
<tspan x="505" y="1371.1">token</tspan>
</text>
<rect x="380" y="1588" width="250" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="1616.4">Withdrawing sos_alerts</tspan>
<tspan x="505" y="1637.2">deletes every contact,</tspan>
<tspan x="505" y="1658">tombstone and token in one</tspan>
<tspan x="505" y="1678.8">transaction</tspan>
</text>
<rect x="702" y="172.5" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="827" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="827" y="200.7">users, consent_records</tspan>
<tspan x="827" y="221.5">(append-only)</tspan>
</text>
<rect x="702" y="449" width="250" height="128" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="827" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="827" y="477">emergency_contacts: user_id,</tspan>
<tspan x="827" y="497.8">name, phone_e164, invited_at,</tspan>
<tspan x="827" y="518.6">opted_out_at, deleted_at.</tspan>
<tspan x="827" y="539.4">UNIQUE (user_id,</tspan>
<tspan x="827" y="560.2">phone_e164)</tspan>
</text>
<rect x="702" y="777" width="250" height="108" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="827" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="827" y="805.4">contact_optout_tokens:</tspan>
<tspan x="827" y="826.2">token_hash (primary key),</tspan>
<tspan x="827" y="847">contact_id. Never a plaintext</tspan>
<tspan x="827" y="867.8">token</tspan>
</text>
<rect x="702" y="1434" width="250" height="108" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="827" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="827" y="1462.4">opted_out_at set: never</tspan>
<tspan x="827" y="1483.2">alerted, never invited again.</tspan>
<tspan x="827" y="1504">Removed by the user: the</tspan>
<tspan x="827" y="1524.8">number stays as a tombstone</tspan>
</text>
<rect x="1024" y="941.5" width="250" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1149" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1149" y="969.8">Contact opens the link.</tspan>
<tspan x="1149" y="990.6">Browser asks for /c only: the</tspan>
<tspan x="1149" y="1011.4">fragment stays on the phone</tspan>
</text>
<rect x="1024" y="1085" width="250" height="108" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1149" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1149" y="1113.4">Page script reads the token</tspan>
<tspan x="1149" y="1134.2">from the fragment and</tspan>
<tspan x="1149" y="1155">removes it from the address</tspan>
<tspan x="1149" y="1175.8">bar</tspan>
</text>
<rect x="1024" y="1280.5" width="250" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1149" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1149" y="1308.7">Contact taps Opt out. Opening</tspan>
<tspan x="1149" y="1329.5">the link alone changes nothing</tspan>
</text>
<rect x="477.2" y="194.5" width="55.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="505" y="210" font-size="13" fill="#1e1e1e" text-anchor="middle">granted</text>
<rect x="643.2" y="415" width="45.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="666" y="430.5" font-size="13" fill="#1e1e1e" text-anchor="middle">insert</text>
<rect x="751.1" y="332.8" width="151.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="827" y="348.3" font-size="13" fill="#1e1e1e" text-anchor="middle">ON DELETE CASCADE</text>
<rect x="631.7" y="737.8" width="68.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="666" y="753.3" font-size="13" fill="#1e1e1e" text-anchor="middle">hash only</text>
<rect x="751.1" y="666" width="151.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="827" y="681.5" font-size="13" fill="#1e1e1e" text-anchor="middle">ON DELETE CASCADE</text>
<rect x="577.8" y="897" width="176.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="666" y="912.5" font-size="13" fill="#1e1e1e" text-anchor="middle">SMS, not through the server</text>
<rect x="800.5" y="974" width="53.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="827" y="989.5" font-size="13" fill="#1e1e1e" text-anchor="middle">GET /c</text>
<rect x="771.1" y="1302.5" width="111.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="827" y="1318" font-size="13" fill="#1e1e1e" text-anchor="middle">token in the body</text>
<rect x="611.8" y="1400" width="108.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="666" y="1415.5" font-size="13" fill="#1e1e1e" text-anchor="middle">set opted_out_at</text>
<rect x="640.1" y="1554" width="51.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="666" y="1569.5" font-size="13" fill="#1e1e1e" text-anchor="middle">erases</text>
<rect x="40" y="1735" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1748" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1735" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1748" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1735" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="250.3" y="1748" font-size="13" fill="#495057">Data</text>
<rect x="303.1" y="1735" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="325.1" y="1748" font-size="13" fill="#495057">Security / emergency</text>
<rect x="476.7" y="1735" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="498.7" y="1748" font-size="13" fill="#495057">External</text>
</svg>
