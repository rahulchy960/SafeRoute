<svg xmlns="http://www.w3.org/2000/svg" width="1462" height="1151" viewBox="0 0 1462 1151" font-family="Helvetica, Arial, sans-serif">
<title>Emergency entry points</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Emergency entry points</text>
<text x="40" y="86" font-size="14" fill="#495057">Every entry opens the same options: a dialog that offers the dialer with 112. Nothing is dialled automatically. Grey: not built yet (P012f1, ADR 0008)</text>
<rect x="40" y="114" width="266" height="951" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">In the app</text>
<rect x="342" y="114" width="522" height="951" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="356" y="135" font-size="14" font-weight="700" fill="#495057">Outside the app</text>
<rect x="900" y="114" width="522" height="951" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="914" y="135" font-size="14" font-weight="700" fill="#495057">The same emergency options</text>
<line x1="173" y1="721.5" x2="1161" y2="792" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="259.5" x2="475" y2="330" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="438" x2="1161" y2="498" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="731" y1="249" x2="1161" y2="498" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="288" y1="216" x2="360" y2="216" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="585" x2="1161" y2="645" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="732" x2="1161" y2="792" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="900" x2="1033" y2="960" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="900" x2="1289" y2="960" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="655.5" width="230" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="683.7">SOS control on Home and</tspan>
<tspan x="173" y="704.5">Search (48 dp, P012e2)</tspan>
</text>
<rect x="360" y="172.5" width="230" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="200.8">Quick Settings tile</tspan>
<tspan x="475" y="221.6">&quot;SafeRoute SOS&quot;: the</tspan>
<tspan x="475" y="242.4">dependable shortcut</tspan>
</text>
<rect x="616" y="183" width="230" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="731" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="731" y="211.2">Pinned notification, opt-in</tspan>
<tspan x="731" y="232">(P012f2, not built)</tspan>
</text>
<rect x="58" y="162" width="230" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="190.4">Settings: Add the SOS tile.</tspan>
<tspan x="173" y="211.2">Android 13+: system</tspan>
<tspan x="173" y="232">request; otherwise four</tspan>
<tspan x="173" y="252.8">steps by hand</tspan>
</text>
<rect x="360" y="330" width="230" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="358.4">Phone locked: Android</tspan>
<tspan x="475" y="379.2">shows the emergency</tspan>
<tspan x="475" y="400">screen over the lock</tspan>
<tspan x="475" y="420.8">screen; nothing is unlocked</tspan>
</text>
<rect x="1046" y="498" width="230" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1161" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1161" y="526.3">EmergencyShortcut: the</tspan>
<tspan x="1161" y="547.1">one place that names the</tspan>
<tspan x="1161" y="567.9">destination</tspan>
</text>
<rect x="1046" y="645" width="230" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1161" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1161" y="673.3">EmergencyActivity: fixed</tspan>
<tspan x="1161" y="694.1">text only, no sign-in, no</tspan>
<tspan x="1161" y="714.9">account, no location</tspan>
</text>
<rect x="1046" y="792" width="230" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1161" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1161" y="820.4">Emergency dialog:</tspan>
<tspan x="1161" y="841.2">&quot;SafeRoute is not an</tspan>
<tspan x="1161" y="862">emergency service&quot;, Call</tspan>
<tspan x="1161" y="882.8">112, Cancel</tspan>
</text>
<rect x="918" y="960" width="230" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1033" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1033" y="988.3">Phone dialer with 112</tspan>
<tspan x="1033" y="1009.1">entered (ACTION_DIAL).</tspan>
<tspan x="1033" y="1029.9">The user starts the call</tspan>
</text>
<rect x="1174" y="960" width="230" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1289" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1289" y="988.3">P014 (not built): the</tspan>
<tspan x="1289" y="1009.1">destination becomes the</tspan>
<tspan x="1289" y="1029.9">5-second SOS countdown</tspan>
</text>
<rect x="652" y="745.8" width="29.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="667" y="761.3" font-size="13" fill="#1e1e1e" text-anchor="middle">tap</text>
<rect x="803" y="457" width="29.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="818" y="472.5" font-size="13" fill="#1e1e1e" text-anchor="middle">tap</text>
<rect x="926.7" y="362.5" width="38.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="946" y="378" font-size="13" fill="#1e1e1e" text-anchor="middle">later</text>
<rect x="304" y="205" width="40.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="324" y="220.5" font-size="13" fill="#1e1e1e" text-anchor="middle">adds</text>
<rect x="1066.4" y="919" width="61.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="1097" y="934.5" font-size="13" fill="#1e1e1e" text-anchor="middle">Call 112</text>
<rect x="1169.2" y="919" width="111.6" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="1225" y="934.5" font-size="13" fill="#1e1e1e" text-anchor="middle">replaced in P014</text>
<rect x="40" y="1086" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1099" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1086" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1099" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1086" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="250.3" y="1099" font-size="13" fill="#495057">Security / emergency</text>
<rect x="401.9" y="1086" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="423.9" y="1099" font-size="13" fill="#495057">External</text>
</svg>
