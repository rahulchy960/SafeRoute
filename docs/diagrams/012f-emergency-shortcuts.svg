<svg xmlns="http://www.w3.org/2000/svg" width="1462" height="1192" viewBox="0 0 1462 1192" font-family="Helvetica, Arial, sans-serif">
<title>Emergency entry points</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Emergency entry points</text>
<text x="40" y="86" font-size="14" fill="#495057">Every entry opens the same options: a dialog that offers the dialer with 112. Nothing is dialled automatically. Grey: not built yet (P012f1 and P012f2, ADR 0008)</text>
<rect x="40" y="114" width="266" height="992" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">In the app</text>
<rect x="342" y="114" width="522" height="992" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="356" y="135" font-size="14" font-weight="700" fill="#495057">Outside the app</text>
<rect x="900" y="114" width="522" height="992" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="914" y="135" font-size="14" font-weight="700" fill="#495057">The same emergency options</text>
<line x1="173" y1="762.5" x2="1161" y2="833" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="280" x2="475" y2="371" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475" y1="479" x2="1161" y2="539" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="288" y1="236.5" x2="360" y2="236.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="626" x2="1161" y2="686" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="773" x2="1161" y2="833" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="941" x2="1033" y2="1001" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1161" y1="941" x2="1289" y2="1001" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="731" y1="311" x2="1161" y2="539" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="731" y1="311" x2="1033" y2="1001" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="696.5" width="230" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="724.7">SOS control on Home and</tspan>
<tspan x="173" y="745.5">Search (48 dp, P012e2)</tspan>
</text>
<rect x="360" y="193" width="230" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="221.3">Quick Settings tile</tspan>
<tspan x="475" y="242.1">&quot;SafeRoute SOS&quot;: the</tspan>
<tspan x="475" y="262.9">dependable shortcut</tspan>
</text>
<rect x="616" y="162" width="230" height="149" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="731" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="731" y="190.1">Pinned notification, opt-in</tspan>
<tspan x="731" y="210.9">(a switch in Settings):</tspan>
<tspan x="731" y="231.7">silent, fixed text, no</tspan>
<tspan x="731" y="252.5">foreground service. Put</tspan>
<tspan x="731" y="273.3">back at app open, after a</tspan>
<tspan x="731" y="294.1">restart and an update</tspan>
</text>
<rect x="58" y="182.5" width="230" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="173" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="173" y="210.9">Settings: Add the SOS tile</tspan>
<tspan x="173" y="231.7">(Android 13+: system</tspan>
<tspan x="173" y="252.5">request; otherwise four</tspan>
<tspan x="173" y="273.3">steps by hand)</tspan>
</text>
<rect x="360" y="371" width="230" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="475" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="475" y="399.4">Phone locked: Android</tspan>
<tspan x="475" y="420.2">shows the emergency</tspan>
<tspan x="475" y="441">screen over the lock</tspan>
<tspan x="475" y="461.8">screen; nothing is unlocked</tspan>
</text>
<rect x="1046" y="539" width="230" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1161" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1161" y="567.3">EmergencyShortcut: the</tspan>
<tspan x="1161" y="588.1">one place that names the</tspan>
<tspan x="1161" y="608.9">destination</tspan>
</text>
<rect x="1046" y="686" width="230" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1161" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1161" y="714.3">EmergencyActivity: fixed</tspan>
<tspan x="1161" y="735.1">text only, no sign-in, no</tspan>
<tspan x="1161" y="755.9">account, no location</tspan>
</text>
<rect x="1046" y="833" width="230" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1161" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1161" y="861.4">Emergency dialog:</tspan>
<tspan x="1161" y="882.2">&quot;SafeRoute is not an</tspan>
<tspan x="1161" y="903">emergency service&quot;, Call</tspan>
<tspan x="1161" y="923.8">112, Cancel</tspan>
</text>
<rect x="918" y="1001" width="230" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1033" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1033" y="1029.3">Phone dialer with 112</tspan>
<tspan x="1033" y="1050.1">entered (ACTION_DIAL).</tspan>
<tspan x="1033" y="1070.9">The user starts the call</tspan>
</text>
<rect x="1174" y="1001" width="230" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1289" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1289" y="1029.3">P014 (not built): the</tspan>
<tspan x="1289" y="1050.1">destination becomes the</tspan>
<tspan x="1289" y="1070.9">5-second SOS countdown</tspan>
</text>
<rect x="652" y="786.8" width="29.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="667" y="802.3" font-size="13" fill="#1e1e1e" text-anchor="middle">tap</text>
<rect x="803" y="498" width="29.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="818" y="513.5" font-size="13" fill="#1e1e1e" text-anchor="middle">tap</text>
<rect x="304" y="225.5" width="40.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="324" y="241" font-size="13" fill="#1e1e1e" text-anchor="middle">adds</text>
<rect x="1066.4" y="960" width="61.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="1097" y="975.5" font-size="13" fill="#1e1e1e" text-anchor="middle">Call 112</text>
<rect x="1169.2" y="960" width="111.6" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="1225" y="975.5" font-size="13" fill="#1e1e1e" text-anchor="middle">replaced in P014</text>
<rect x="884.2" y="414" width="123.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="946" y="429.5" font-size="13" fill="#1e1e1e" text-anchor="middle">Open SOS, or a tap</text>
<rect x="851.4" y="645" width="61.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="882" y="660.5" font-size="13" fill="#1e1e1e" text-anchor="middle">Call 112</text>
<rect x="40" y="1127" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1140" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1127" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1140" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1127" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="250.3" y="1140" font-size="13" fill="#495057">Security / emergency</text>
<rect x="401.9" y="1127" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="423.9" y="1140" font-size="13" fill="#495057">External</text>
</svg>
