<svg xmlns="http://www.w3.org/2000/svg" width="998" height="897" viewBox="0 0 998 897" font-family="Helvetica, Arial, sans-serif">
<title>Device-first SOS</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Device-first SOS</text>
<text x="40" y="86" font-size="14" fill="#495057">Contacts and 112 are reached without the server; sync is layered on top (Plan v7 §7.1)</text>
<line x1="499" y1="170" x2="499" y2="230" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="499" y1="296" x2="499" y2="356" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="499" y1="412" x2="145" y2="472" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="499" y1="412" x2="381" y2="482.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="499" y1="412" x2="617" y2="487.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="499" y1="412" x2="853" y2="482.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="145" y1="559" x2="145" y2="619" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="145" y1="685" x2="145" y2="745" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="145" y1="685" x2="381" y2="745" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="853" y1="548.5" x2="853" y2="619" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="394" y="114" width="210" height="56" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="499" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="499" y="147.6">Hold 2 s (arm)</tspan>
</text>
<rect x="394" y="230" width="210" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="499" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="499" y="258.2">5 s countdown (cancel =</tspan>
<tspan x="499" y="279">local only)</tspan>
</text>
<rect x="394" y="356" width="210" height="56" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="499" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="499" y="389.6">Room record clientSosId</tspan>
</text>
<rect x="40" y="472" width="210" height="87" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="145" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="145" y="500.3">WorkManager sync</tspan>
<tspan x="145" y="521.1">POST /v1/sos</tspan>
<tspan x="145" y="541.9">(idempotent)</tspan>
</text>
<rect x="276" y="482.5" width="210" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="381" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="381" y="510.7">SMS to contacts</tspan>
<tspan x="381" y="531.5">SmsManager or intent</tspan>
</text>
<rect x="512" y="487.5" width="210" height="56" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="617" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="617" y="521.1">Call 112 (system dialer)</tspan>
</text>
<rect x="748" y="482.5" width="210" height="66" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="853" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="853" y="510.7">Foreground service</tspan>
<tspan x="853" y="531.5">location every 5 s</tspan>
</text>
<rect x="40" y="619" width="210" height="66" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="145" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="145" y="647.2">Server session + live</tspan>
<tspan x="145" y="668">share</tspan>
</text>
<rect x="748" y="619" width="210" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="853" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="853" y="647.2">I'm safe → resolve +</tspan>
<tspan x="853" y="668">notify</tspan>
</text>
<rect x="40" y="745" width="210" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="145" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="145" y="773.2">FCM push to contacts</tspan>
<tspan x="145" y="794">with app</tspan>
</text>
<rect x="276" y="745" width="210" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="381" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="381" y="773.2">Follow-up SMS with</tspan>
<tspan x="381" y="794">live link</tspan>
</text>
<rect x="40" y="832" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="845" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="832" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="845" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="832" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="250.3" y="845" font-size="13" fill="#495057">Data</text>
<rect x="303.1" y="832" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="325.1" y="845" font-size="13" fill="#495057">Security / emergency</text>
<rect x="476.7" y="832" width="16" height="16" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="1.5"/>
<text x="498.7" y="845" font-size="13" fill="#495057">Infra / workflow</text>
<rect x="618.3" y="832" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="640.3" y="845" font-size="13" fill="#495057">External</text>
</svg>
