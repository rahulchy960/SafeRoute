<svg xmlns="http://www.w3.org/2000/svg" width="1286" height="1085" viewBox="0 0 1286 1085" font-family="Helvetica, Arial, sans-serif">
<title>SOS alerts by SMS: the engine</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">SOS alerts by SMS: the engine</text>
<text x="40" y="86" font-size="14" fill="#495057">One message per contact, written down before it is sent, never sent twice once the phone said OK. Not yet connected to a running SOS (P014b1, ADR 0027)</text>
<rect x="40" y="114" width="286" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">What it reads (the phone only)</text>
<rect x="362" y="114" width="562" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="376" y="135" font-size="14" font-weight="700" fill="#495057">core/emergency: SosAlerts</text>
<rect x="960" y="114" width="286" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="974" y="135" font-size="14" font-weight="700" fill="#495057">The phone: feature/emergency/SosSms.kt</text>
<line x1="183" y1="274" x2="643" y2="320" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="428" x2="643" y2="495" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="428" x2="643" y2="649" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="183" y1="582" x2="1103" y2="628" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="561" x2="1103" y2="628" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1103" y1="736" x2="1103" y2="792.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="978" y1="825.5" x2="630" y2="825.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="978" y1="825.5" x2="906" y2="825.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1103" y1="858.5" x2="781" y2="915" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="781" y1="782" x2="643" y2="561" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="781" y1="869" x2="781" y2="915" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="208" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="236.2">ActiveSosContacts: not opted</tspan>
<tspan x="183" y="257">out, at most 5</tspan>
</text>
<rect x="58" y="474" width="250" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="502.4">SosMessage: who, map link,</tspan>
<tspan x="183" y="523.2">accuracy, time, battery, call</tspan>
<tspan x="183" y="544">112. At most 3 SMS parts, EN</tspan>
<tspan x="183" y="564.8">or BN</tspan>
</text>
<rect x="518" y="320" width="250" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="643" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="643" y="348.4">prepare: one PENDING action</tspan>
<tspan x="643" y="369.2">per contact, with a copy of</tspan>
<tspan x="643" y="390">name and number. Decided</tspan>
<tspan x="643" y="410.8">once</tspan>
</text>
<rect x="518" y="495" width="250" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="643" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="643" y="523.2">IN_PROGRESS: written</tspan>
<tspan x="643" y="544">BEFORE the phone is asked</tspan>
</text>
<rect x="380" y="797.5" width="250" height="56" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="831.1">SENT: never sent again</tspan>
</text>
<rect x="656" y="782" width="250" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="781" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="781" y="810.3">FAILED_RETRYABLE: again</tspan>
<tspan x="781" y="831.1">after 30 s, at most 20 tries,</tspan>
<tspan x="781" y="851.9">only while the SOS is active</tspan>
</text>
<rect x="656" y="915" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="781" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="781" y="943.2">FAILED_FINAL: refused, no</tspan>
<tspan x="781" y="964">permission, or 20 tries used</tspan>
</text>
<rect x="518" y="649" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="643" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="643" y="677.2">SKIPPED: the contact opted</tspan>
<tspan x="643" y="698">out before the message left</tspan>
</text>
<rect x="978" y="628" width="250" height="108" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="1103" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1103" y="656.4">AndroidSmsGateway: needs a</tspan>
<tspan x="1103" y="677.2">build with SEND_SMS and the</tspan>
<tspan x="1103" y="698">user's grant; default SIM for</tspan>
<tspan x="1103" y="718.8">SMS; multipart</tspan>
</text>
<rect x="978" y="792.5" width="250" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1103" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1103" y="820.7">The phone's answer per part:</tspan>
<tspan x="1103" y="841.5">OK, or an error code</tspan>
</text>
<rect x="604.8" y="450.5" width="76.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="643" y="466" font-size="13" fill="#1e1e1e" text-anchor="middle">each round</text>
<rect x="610.2" y="527.5" width="65.6" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="643" y="543" font-size="13" fill="#1e1e1e" text-anchor="middle">opted out</text>
<rect x="580.6" y="594" width="124.8" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="643" y="609.5" font-size="13" fill="#1e1e1e" text-anchor="middle">text of that moment</text>
<rect x="789.2" y="814.5" width="29.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="804" y="830" font-size="13" fill="#1e1e1e" text-anchor="middle">OK</text>
<rect x="907.5" y="814.5" width="68.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="942" y="830" font-size="13" fill="#1e1e1e" text-anchor="middle">may pass</text>
<rect x="900.6" y="875.8" width="82.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="942" y="891.3" font-size="13" fill="#1e1e1e" text-anchor="middle">cannot pass</text>
<rect x="693.4" y="660.5" width="37.2" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="712" y="676" font-size="13" fill="#1e1e1e" text-anchor="middle">30 s</text>
<rect x="752.6" y="881" width="56.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="781" y="896.5" font-size="13" fill="#1e1e1e" text-anchor="middle">20 tries</text>
<rect x="40" y="1020" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1033" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1020" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="156.8" y="1033" font-size="13" fill="#495057">Data</text>
<rect x="209.6" y="1020" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="231.6" y="1033" font-size="13" fill="#495057">Security / emergency</text>
<rect x="383.2" y="1020" width="16" height="16" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="1.5"/>
<text x="405.2" y="1033" font-size="13" fill="#495057">Infra / workflow</text>
<rect x="524.8" y="1020" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="546.8" y="1033" font-size="13" fill="#495057">External</text>
</svg>
