<text x="727" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="727" y="1020.2">Auth: Bearer token, API</tspan>
<tspan x="727" y="1041">host only</tspan>
</text>
<rect x="622" y="1128.5" width="210" height="66" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="727" font-size="16" fill="#1e1e1e" text-anchor="middle">
