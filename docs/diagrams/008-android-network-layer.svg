<tspan x="727" y="1177.5">503 or I/O error</tspan>
</text>
<rect x="622" y="1265" width="210" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="727" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="727" y="1293.3">SafeRoute API (Cloud</tspan>
<tspan x="727" y="1314.1">Run staging), HTTPS</tspan>
<tspan x="727" y="1334.9">only</tspan>
</text>
