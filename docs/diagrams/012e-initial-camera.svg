<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="1204" viewBox="0 0 1512 1204" font-family="Helvetica, Arial, sans-serif">
<title>Where the map opens</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Where the map opens</text>
<text x="40" y="86" font-size="14" fill="#495057">One automatic move per launch, and only when the permission was already granted. The permission is never requested at launch. Nothing is stored or logged (P012e1, ADR 0015)</text>
<rect x="40" y="114" width="276" height="1004" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Home is created</text>
<rect x="352" y="114" width="542" height="1004" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="366" y="135" font-size="14" font-weight="700" fill="#495057">Waiting (at most 8 s)</text>
<rect x="930" y="114" width="542" height="1004" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="944" y="135" font-size="14" font-weight="700" fill="#495057">Settled: the camera is the user’s</text>
<line x1="178" y1="218" x2="178" y2="278" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="178" y1="344" x2="1201" y2="414.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="178" y1="344" x2="178" y2="404" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="178" y1="491" x2="178" y2="551" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="178" y1="638" x2="1201" y2="698" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="178" y1="638" x2="623" y2="698" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623" y1="785" x2="490" y2="866" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623" y1="785" x2="756" y2="845" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="932" x2="1068" y2="1013" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="756" y1="953" x2="1334" y2="1013" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="240" height="56" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="178" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="178" y="195.6">Home ViewModel created</tspan>
</text>
<rect x="58" y="278" width="240" height="66" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="178" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="178" y="306.2">A camera is saved (rotation,</tspan>
<tspan x="178" y="327">process death)?</tspan>
</text>
<rect x="58" y="404" width="240" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="178" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="178" y="432.3">Fresh launch: the map</tspan>
<tspan x="178" y="453.1">shows the whole region</tspan>
<tspan x="178" y="473.9">(overview, zoom 6)</tspan>
</text>
<rect x="58" y="551" width="240" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="178" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="178" y="579.3">Home first shows: is the</tspan>
<tspan x="178" y="600.1">location permission already</tspan>
<tspan x="178" y="620.9">granted?</tspan>
</text>
<rect x="503" y="698" width="240" height="87" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="623" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="623" y="726.3">Waiting: location starts; the</tspan>
<tspan x="623" y="747.1">phone’s last known position</tspan>
<tspan x="623" y="767.9">is asked for</tspan>
</text>
<rect x="370" y="866" width="240" height="66" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="490" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="490" y="894.2">A position at most 10</tspan>
<tspan x="490" y="915">minutes old, or a new one</tspan>
</text>
<rect x="636" y="845" width="240" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="756" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="756" y="873.4">A user gesture, a tap on my</tspan>
<tspan x="756" y="894.2">location, a chosen place or</tspan>
<tspan x="756" y="915">route, 8 s passed, or no</tspan>
<tspan x="756" y="935.8">position can be had</tspan>
</text>
<rect x="1081" y="414.5" width="240" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1201" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1201" y="442.7">The saved camera is shown;</tspan>
<tspan x="1201" y="463.5">nothing moves by itself</tspan>
</text>
<rect x="1081" y="698" width="240" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="1201" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1201" y="726.3">The overview stays. My</tspan>
<tspan x="1201" y="747.1">location (tap) asks for the</tspan>
<tspan x="1201" y="767.9">permission as before</tspan>
</text>
<rect x="948" y="1013" width="240" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1068" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1068" y="1041.3">Move ONCE to the position</tspan>
<tspan x="1068" y="1062.1">at zoom 15, inside the</tspan>
<tspan x="1068" y="1082.9">launch region or not</tspan>
</text>
<rect x="1214" y="1013" width="240" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1334" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1334" y="1041.3">The camera is left alone;</tspan>
<tspan x="1334" y="1062.1">later positions move only the</tspan>
<tspan x="1334" y="1082.9">dot</tspan>
</text>
<rect x="673" y="368.3" width="33.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="689.5" y="383.8" font-size="13" fill="#1e1e1e" text-anchor="middle">yes</text>
<rect x="165" y="363" width="26" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="178" y="378.5" font-size="13" fill="#1e1e1e" text-anchor="middle">no</text>
<rect x="676.5" y="657" width="26" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="689.5" y="672.5" font-size="13" fill="#1e1e1e" text-anchor="middle">no</text>
<rect x="384" y="657" width="33.1" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="400.5" y="672.5" font-size="13" fill="#1e1e1e" text-anchor="middle">yes</text>
<rect x="40" y="1139" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1152" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1139" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1152" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1139" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="250.3" y="1152" font-size="13" fill="#495057">Security / emergency</text>
</svg>
