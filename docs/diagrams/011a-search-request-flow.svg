<svg xmlns="http://www.w3.org/2000/svg" width="1186" height="1674" viewBox="0 0 1186 1674" font-family="Helvetica, Arial, sans-serif">
<title>Place search request flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Place search request flow</text>
<text x="40" y="86" font-size="14" fill="#495057">The app never holds the geocoding key. The provider sees SafeRoute's server, not the user. Nothing about a search is logged or stored (P011a, ADR 0018)</text>
<rect x="40" y="114" width="261" height="1474" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Phone</text>
<rect x="337" y="114" width="512" height="1474" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="351" y="135" font-size="14" font-weight="700" fill="#495057">SafeRoute API</text>
<rect x="885" y="114" width="261" height="1474" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="899" y="135" font-size="14" font-weight="700" fill="#495057">Outside SafeRoute</text>
<line x1="170.5" y1="249" x2="593" y2="309" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="396" x2="593" y2="456" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="564" x2="593" y2="624" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="711" x2="593" y2="771" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="879" x2="467.5" y2="939" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="879" x2="170.5" y2="959.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="467.5" y1="1067" x2="593" y2="1127" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="718.5" y1="1067" x2="593" y2="1127" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="1235" x2="1015.5" y2="1336.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="1235" x2="170.5" y2="1295" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="1235" x2="593" y2="1305.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1015.5" y1="1402.5" x2="170.5" y2="1504" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1015.5" y1="1067" x2="593" y2="1127" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="225" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="190.3">App: GET /v1/search with</tspan>
<tspan x="170.5" y="211.1">q, a coarse map area and a</tspan>
<tspan x="170.5" y="231.9">Firebase ID token</tspan>
</text>
<rect x="480.5" y="309" width="225" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="337.3">requireUser: verify the</tspan>
<tspan x="593" y="358.1">token, load the account</tspan>
<tspan x="593" y="378.9">(401, 403)</tspan>
</text>
<rect x="480.5" y="456" width="225" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="484.4">Validate and normalise q:</tspan>
<tspan x="593" y="505.2">NFC, 2 to 100 code points,</tspan>
<tspan x="593" y="526">no control characters,</tspan>
<tspan x="593" y="546.8">joiners kept (400)</tspan>
</text>
<rect x="480.5" y="624" width="225" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="652.3">Coarsen near to 2</tspan>
<tspan x="593" y="673.1">decimals (about 1 km);</tspan>
<tspan x="593" y="693.9">default bias if absent</tspan>
</text>
<rect x="480.5" y="771" width="225" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="799.4">Rate limiter, in order: user</tspan>
<tspan x="593" y="820.2">burst (30, then 1/s), user</tspan>
<tspan x="593" y="841">daily (1000), shared</tspan>
<tspan x="593" y="861.8">provider budget</tspan>
</text>
<rect x="355" y="939" width="225" height="128" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="467.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="467.5" y="967">PostgreSQL</tspan>
<tspan x="467.5" y="987.8">rate_limit_buckets: one</tspan>
<tspan x="467.5" y="1008.6">row per bucket, one</tspan>
<tspan x="467.5" y="1029.4">atomic statement,</tspan>
<tspan x="467.5" y="1050.2">database time</tspan>
</text>
<rect x="480.5" y="1127" width="225" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="1155.4">Provider adapter, chosen</tspan>
<tspan x="593" y="1176.2">by name: adds the key, 3 s</tspan>
<tspan x="593" y="1197">timeout, no retry, size</tspan>
<tspan x="593" y="1217.8">bound, strict parsing</tspan>
</text>
<rect x="903" y="1336.5" width="225" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1015.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1015.5" y="1364.7">Geocoding provider</tspan>
<tspan x="1015.5" y="1385.5">(Geoapify or LocationIQ)</tspan>
</text>
<rect x="58" y="1504" width="225" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="1532.2">200: results + attribution,</tspan>
<tspan x="170.5" y="1553">Cache-Control: no-store</tspan>
</text>
<rect x="58" y="959.5" width="225" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="987.8">429 rate_limited +</tspan>
<tspan x="170.5" y="1008.6">Retry-After (a user's own</tspan>
<tspan x="170.5" y="1029.4">limit)</tspan>
</text>
<rect x="58" y="1295" width="225" height="149" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="1323.1">503 search_unavailable (+</tspan>
<tspan x="170.5" y="1343.9">Retry-After): shared budget</tspan>
<tspan x="170.5" y="1364.7">used up, provider 429,</tspan>
<tspan x="170.5" y="1385.5">timeout, network, bad</tspan>
<tspan x="170.5" y="1406.3">body, or our key refused.</tspan>
<tspan x="170.5" y="1427.1">Never 401 or 403</tspan>
</text>
<rect x="606" y="939" width="225" height="128" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="718.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="718.5" y="967">Secret Manager → Cloud</tspan>
<tspan x="718.5" y="987.8">Run env:</tspan>
<tspan x="718.5" y="1008.6">GEOCODING_API_KEY.</tspan>
<tspan x="718.5" y="1029.4">Missing in production: the</tspan>
<tspan x="718.5" y="1050.2">API refuses to start</tspan>
</text>
<rect x="480.5" y="1305.5" width="225" height="128" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="1333.5">NEVER LOGGED OR</tspan>
<tspan x="593" y="1354.3">STORED: query,</tspan>
<tspan x="593" y="1375.1">coordinates, results, key.</tspan>
<tspan x="593" y="1395.9">One log line per call:</tspan>
<tspan x="593" y="1416.7">outcome, latency, count</tspan>
</text>
<rect x="903" y="939" width="225" height="128" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1015.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1015.5" y="967">Evaluation harness (local,</tspan>
<tspan x="1015.5" y="987.8">key from the environment):</tspan>
<tspan x="1015.5" y="1008.6">fixture queries → same</tspan>
<tspan x="1015.5" y="1029.4">adapter → hit rate by</tspan>
<tspan x="1015.5" y="1050.2">district and script</tspan>
</text>
<rect x="481.6" y="898" width="97.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="530.3" y="913.5" font-size="13" fill="#1e1e1e" text-anchor="middle">take one token</text>
<rect x="321.7" y="908.3" width="120.2" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="381.8" y="923.8" font-size="13" fill="#1e1e1e" text-anchor="middle">user bucket empty</text>
<rect x="477.3" y="1086" width="105.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="530.3" y="1101.5" font-size="13" fill="#1e1e1e" text-anchor="middle">all three passed</text>
<rect x="723.5" y="1274.8" width="161.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="804.3" y="1290.3" font-size="13" fill="#1e1e1e" text-anchor="middle">HTTPS, coarse area only</text>
<rect x="357" y="1254" width="49.4" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="381.8" y="1269.5" font-size="13" fill="#1e1e1e" text-anchor="middle">failure</text>
<rect x="537.9" y="1442.3" width="110.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="593" y="1457.8" font-size="13" fill="#1e1e1e" text-anchor="middle">mapped to Place</text>
<rect x="40" y="1609" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1622" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1609" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1622" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1609" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="250.3" y="1622" font-size="13" fill="#495057">Data</text>
<rect x="303.1" y="1609" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="325.1" y="1622" font-size="13" fill="#495057">Security / emergency</text>
<rect x="476.7" y="1609" width="16" height="16" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="1.5"/>
<text x="498.7" y="1622" font-size="13" fill="#495057">Infra / workflow</text>
<rect x="618.3" y="1609" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="640.3" y="1622" font-size="13" fill="#495057">External</text>
</svg>
