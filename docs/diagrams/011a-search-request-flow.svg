<svg xmlns="http://www.w3.org/2000/svg" width="1186" height="1715" viewBox="0 0 1186 1715" font-family="Helvetica, Arial, sans-serif">
<title>Place search request flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">Place search request flow</text>
<text x="40" y="86" font-size="14" fill="#495057">The app never holds the geocoding key. The provider sees SafeRoute's server, not the user. Nothing about a search is logged or stored (P011a, ADR 0018)</text>
<rect x="40" y="114" width="261" height="1515" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Phone</text>
<rect x="337" y="114" width="512" height="1515" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="351" y="135" font-size="14" font-weight="700" fill="#495057">SafeRoute API</text>
<rect x="885" y="114" width="261" height="1515" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="899" y="135" font-size="14" font-weight="700" fill="#495057">Outside SafeRoute</text>
<line x1="170.5" y1="290" x2="593" y2="350" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="437" x2="593" y2="497" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="605" x2="593" y2="665" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="752" x2="593" y2="812" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="920" x2="467.5" y2="980" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="920" x2="170.5" y2="1000.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="467.5" y1="1108" x2="593" y2="1168" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="718.5" y1="1108" x2="593" y2="1168" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="1276" x2="1015.5" y2="1377.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="1276" x2="170.5" y2="1336" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="593" y1="1276" x2="593" y2="1346.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1015.5" y1="1443.5" x2="170.5" y2="1545" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1015.5" y1="1108" x2="593" y2="1168" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="162" width="225" height="128" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="190">App: POST /v1/search</tspan>
<tspan x="170.5" y="210.8">with q and a coarse map</tspan>
<tspan x="170.5" y="231.6">area in the body (never in</tspan>
<tspan x="170.5" y="252.4">the URL), and a Firebase</tspan>
<tspan x="170.5" y="273.2">ID token</tspan>
</text>
<rect x="480.5" y="350" width="225" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="378.3">requireUser: verify the</tspan>
<tspan x="593" y="399.1">token, load the account</tspan>
<tspan x="593" y="419.9">(401, 403)</tspan>
</text>
<rect x="480.5" y="497" width="225" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="525.4">Validate and normalise q:</tspan>
<tspan x="593" y="546.2">NFC, 2 to 100 code points,</tspan>
<tspan x="593" y="567">no control characters,</tspan>
<tspan x="593" y="587.8">joiners kept (400)</tspan>
</text>
<rect x="480.5" y="665" width="225" height="87" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="693.3">Coarsen near to 2</tspan>
<tspan x="593" y="714.1">decimals (about 1 km);</tspan>
<tspan x="593" y="734.9">default bias if absent</tspan>
</text>
<rect x="480.5" y="812" width="225" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="840.4">Rate limiter, in order: user</tspan>
<tspan x="593" y="861.2">burst (30, then 1/s), user</tspan>
<tspan x="593" y="882">daily (1000), shared</tspan>
<tspan x="593" y="902.8">provider budget</tspan>
</text>
<rect x="355" y="980" width="225" height="128" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="467.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="467.5" y="1008">PostgreSQL</tspan>
<tspan x="467.5" y="1028.8">rate_limit_buckets: one</tspan>
<tspan x="467.5" y="1049.6">row per bucket, one</tspan>
<tspan x="467.5" y="1070.4">atomic statement,</tspan>
<tspan x="467.5" y="1091.2">database time</tspan>
</text>
<rect x="480.5" y="1168" width="225" height="108" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="1196.4">Provider adapter, chosen</tspan>
<tspan x="593" y="1217.2">by name: adds the key, 3 s</tspan>
<tspan x="593" y="1238">timeout, no retry, size</tspan>
<tspan x="593" y="1258.8">bound, strict parsing</tspan>
</text>
<rect x="903" y="1377.5" width="225" height="66" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1015.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1015.5" y="1405.7">Geocoding provider</tspan>
<tspan x="1015.5" y="1426.5">(Geoapify or LocationIQ)</tspan>
</text>
<rect x="58" y="1545" width="225" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="1573.2">200: results + attribution,</tspan>
<tspan x="170.5" y="1594">Cache-Control: no-store</tspan>
</text>
<rect x="58" y="1000.5" width="225" height="87" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="1028.8">429 rate_limited +</tspan>
<tspan x="170.5" y="1049.6">Retry-After (a user's own</tspan>
<tspan x="170.5" y="1070.4">limit)</tspan>
</text>
<rect x="58" y="1336" width="225" height="149" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="170.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="170.5" y="1364.1">503 search_unavailable (+</tspan>
<tspan x="170.5" y="1384.9">Retry-After): shared budget</tspan>
<tspan x="170.5" y="1405.7">used up, provider 429,</tspan>
<tspan x="170.5" y="1426.5">timeout, network, bad</tspan>
<tspan x="170.5" y="1447.3">body, or our key refused.</tspan>
<tspan x="170.5" y="1468.1">Never 401 or 403</tspan>
</text>
<rect x="606" y="980" width="225" height="128" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="718.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="718.5" y="1008">Secret Manager → Cloud</tspan>
<tspan x="718.5" y="1028.8">Run env:</tspan>
<tspan x="718.5" y="1049.6">GEOCODING_API_KEY.</tspan>
<tspan x="718.5" y="1070.4">Missing in production: the</tspan>
<tspan x="718.5" y="1091.2">API refuses to start</tspan>
</text>
<rect x="480.5" y="1346.5" width="225" height="128" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="593" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="593" y="1374.5">NEVER LOGGED OR</tspan>
<tspan x="593" y="1395.3">STORED: query,</tspan>
<tspan x="593" y="1416.1">coordinates, results, key.</tspan>
<tspan x="593" y="1436.9">One log line per call:</tspan>
<tspan x="593" y="1457.7">outcome, latency, count</tspan>
</text>
<rect x="903" y="980" width="225" height="128" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1015.5" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1015.5" y="1008">Evaluation harness (local,</tspan>
<tspan x="1015.5" y="1028.8">key from the environment):</tspan>
<tspan x="1015.5" y="1049.6">fixture queries → same</tspan>
<tspan x="1015.5" y="1070.4">adapter → hit rate by</tspan>
<tspan x="1015.5" y="1091.2">district and script</tspan>
</text>
<rect x="481.6" y="939" width="97.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="530.3" y="954.5" font-size="13" fill="#1e1e1e" text-anchor="middle">take one token</text>
<rect x="321.7" y="949.3" width="120.2" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="381.8" y="964.8" font-size="13" fill="#1e1e1e" text-anchor="middle">user bucket empty</text>
<rect x="477.3" y="1127" width="105.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="530.3" y="1142.5" font-size="13" fill="#1e1e1e" text-anchor="middle">all three passed</text>
<rect x="723.5" y="1315.8" width="161.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="804.3" y="1331.3" font-size="13" fill="#1e1e1e" text-anchor="middle">HTTPS, coarse area only</text>
<rect x="357" y="1295" width="49.4" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="381.8" y="1310.5" font-size="13" fill="#1e1e1e" text-anchor="middle">failure</text>
<rect x="537.9" y="1483.3" width="110.3" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="593" y="1498.8" font-size="13" fill="#1e1e1e" text-anchor="middle">mapped to Place</text>
<rect x="40" y="1650" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1663" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1650" width="16" height="16" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<text x="156.8" y="1663" font-size="13" fill="#495057">Service</text>
<rect x="228.3" y="1650" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="250.3" y="1663" font-size="13" fill="#495057">Data</text>
<rect x="303.1" y="1650" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="325.1" y="1663" font-size="13" fill="#495057">Security / emergency</text>
<rect x="476.7" y="1650" width="16" height="16" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="1.5"/>
<text x="498.7" y="1663" font-size="13" fill="#495057">Infra / workflow</text>
<rect x="618.3" y="1650" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="640.3" y="1663" font-size="13" fill="#495057">External</text>
</svg>
