<svg xmlns="http://www.w3.org/2000/svg" width="1884" height="1085" viewBox="0 0 1884 1085" font-family="Helvetica, Arial, sans-serif">
<title>SOS on the device: what runs an emergency</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="62" font-size="24" font-weight="700" fill="#1e1e1e">SOS on the device: what runs an emergency</text>
<text x="40" y="86" font-size="14" fill="#495057">The runner belongs to the app's process, not to a screen. It asks the engine for every step and acts only on a yes; the foreground service is its host (P014a2, ADR 0027)</text>
<rect x="40" y="114" width="286" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="135" font-size="14" font-weight="700" fill="#495057">Who starts it</text>
<rect x="362" y="114" width="562" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="376" y="135" font-size="14" font-weight="700" fill="#495057">core/emergency (plain Kotlin)</text>
<rect x="960" y="114" width="562" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="974" y="135" font-size="14" font-weight="700" fill="#495057">The phone's parts: feature/emergency, core/location</text>
<rect x="1558" y="114" width="286" height="885" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="1572" y="135" font-size="14" font-weight="700" fill="#495057">Phone storage: Room</text>
<line x1="183" y1="316" x2="643" y2="362" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="470" x2="505" y2="537" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="505" y1="603" x2="1701" y2="803" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="768" y1="416" x2="1116" y2="416" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1241" y1="470" x2="1103" y2="516" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1103" y1="516" x2="643" y2="470" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="470" x2="1379" y2="537" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="470" x2="781" y2="516" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1241" y1="670" x2="781" y2="624" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="781" y1="624" x2="1701" y2="680.5" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1116" y1="948" x2="768" y2="948" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="643" y1="915" x2="1701" y2="869" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58" y="208" width="250" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="183" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="183" y="236.4">SOS screens and shortcuts</tspan>
<tspan x="183" y="257.2">(P014a3, P014c): start,</tspan>
<tspan x="183" y="278">cancel, I'm safe, resume</tspan>
<tspan x="183" y="298.8">when visible</tspan>
</text>
<rect x="518" y="362" width="250" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="643" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="643" y="390.4">SosRunner: countdown rebuilt</tspan>
<tspan x="643" y="411.2">from countdownEndsAt,</tspan>
<tspan x="643" y="432">trigger at its end, app-lifetime</tspan>
<tspan x="643" y="452.8">scope</tspan>
</text>
<rect x="380" y="537" width="250" height="66" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="505" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="505" y="565.2">SosEngine: writes the new</tspan>
<tspan x="505" y="586">state first, answers once</tspan>
</text>
<rect x="656" y="516" width="250" height="108" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="781" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="781" y="544.4">SosTrail: every 5 s (15 s</tspan>
<tspan x="781" y="565.2">below 10% battery); last</tspan>
<tspan x="781" y="586">known, approximate, stale,</tspan>
<tspan x="781" y="606.8">none. Never blocks</tspan>
</text>
<rect x="518" y="915" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="643" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="643" y="943.2">SosHousekeeping: purge after</tspan>
<tspan x="643" y="964">30 days, wipe on sign-out</tspan>
</text>
<rect x="1116" y="362" width="250" height="108" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1241" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1241" y="390.4">SosHost: with a location</tspan>
<tspan x="1241" y="411.2">permission, the foreground</tspan>
<tspan x="1241" y="432">service; otherwise a plain</tspan>
<tspan x="1241" y="452.8">notification</tspan>
</text>
<rect x="978" y="516" width="250" height="108" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="1103" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1103" y="544.4">SosForegroundService (type</tspan>
<tspan x="1103" y="565.2">location, not sticky) +</tspan>
<tspan x="1103" y="586">notification: fixed text, Call</tspan>
<tspan x="1103" y="606.8">112</tspan>
</text>
<rect x="1254" y="537" width="250" height="66" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1379" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1379" y="565.2">Vibration: one tick per second,</tspan>
<tspan x="1379" y="586">a pattern at the trigger</tspan>
</text>
<rect x="1116" y="670" width="250" height="87" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1241" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1241" y="698.3">TrailLocationSource (Fused</tspan>
<tspan x="1241" y="719.1">Location), running only during</tspan>
<tspan x="1241" y="739.9">an SOS</tspan>
</text>
<rect x="1116" y="915" width="250" height="66" rx="10" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="1241" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1241" y="943.2">WorkManager:</tspan>
<tspan x="1241" y="964">SosPurgeWorker, once a day</tspan>
</text>
<rect x="1576" y="803" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="1701" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1701" y="831.2">sos_records: the emergency</tspan>
<tspan x="1701" y="852">and its state</tspan>
</text>
<rect x="1576" y="680.5" width="250" height="66" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="1701" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1701" y="708.7">sos_points: the trail. Stays on</tspan>
<tspan x="1701" y="729.5">the phone</tspan>
</text>
<rect x="537.3" y="492.5" width="73.4" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="574" y="508" font-size="13" fill="#1e1e1e" text-anchor="middle">every step</text>
<rect x="903.9" y="405" width="76.2" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="942" y="420.5" font-size="13" fill="#1e1e1e" text-anchor="middle">begin / end</text>
<rect x="819.6" y="482" width="106.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="873" y="497.5" font-size="13" fill="#1e1e1e" text-anchor="middle">follows its state</text>
<rect x="974.1" y="492.5" width="73.9" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="1011" y="508" font-size="13" fill="#1e1e1e" text-anchor="middle">after a yes</text>
<rect x="674.7" y="482" width="74.7" height="22" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#ced4da" stroke-width="1"/>
<text x="712" y="497.5" font-size="13" fill="#1e1e1e" text-anchor="middle">start / stop</text>
<rect x="40" y="1020" width="16" height="16" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="62" y="1033" font-size="13" fill="#495057">App / UI</text>
<rect x="134.8" y="1020" width="16" height="16" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
<text x="156.8" y="1033" font-size="13" fill="#495057">Data</text>
<rect x="209.6" y="1020" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<text x="231.6" y="1033" font-size="13" fill="#495057">Security / emergency</text>
<rect x="383.2" y="1020" width="16" height="16" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="1.5"/>
<text x="405.2" y="1033" font-size="13" fill="#495057">Infra / workflow</text>
<rect x="524.8" y="1020" width="16" height="16" rx="3" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
<text x="546.8" y="1033" font-size="13" fill="#495057">External</text>
</svg>
