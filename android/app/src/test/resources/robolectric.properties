#
# Robolectric runs the tests against a copy of the Android framework. Its Android 16 (API 36)
# copy needs Java 21, and this project compiles and tests with JDK 17 (jvmToolchain in
# app/build.gradle.kts), so the tests use Android 15 (API 35), the newest that runs on Java 17.
# Raise this together with the JDK (follow-up recorded in the P007a prompt log).
sdk=35

# A test that does not ask for an application gets a plain one (P014e). The real one opens
# the database and starts the app-lifetime work for every test, and a test cannot close
# either. A test that needs the app's Hilt graph asks for HiltTestApplication. No test boots
# the real application now; one that should has to ask for SafeRouteApplication by name.
application=android.app.Application
